version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # A new Keycloak release arrives as one pull request; CI runs the integration test on it.
      keycloak:
        patterns:
          - "org.keycloak:*"
      test-dependencies:
        patterns:
          - "org.junit*"
          - "org.mockito*"
          - "org.assertj*"
          - "org.testcontainers*"
          - "org.slf4j:slf4j-simple"
      # the plugins, and the libraries pom.xml overrides for cyclonedx-maven-plugin
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.cyclonedx:*"
          - "com.fasterxml.jackson*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  # Base image of the provider image (Dockerfile)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
