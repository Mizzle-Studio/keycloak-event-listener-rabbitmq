name: CI

on:
  push:
  pull_request:
  schedule:
    # weekly, to pick up advisories published after the last change
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit tests, then integration tests against Keycloak and RabbitMQ containers.
      - name: Build
        run: ./mvnw --batch-mode --no-transfer-progress --errors --show-version clean verify

      - name: Checksum
        run: |
          cd target
          sha256sum keycloak-to-rabbit-*.jar | tee keycloak-to-rabbit.sha256

      - name: Upload provider jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-jar
          path: |
            target/keycloak-to-rabbit-*.jar
            target/keycloak-to-rabbit.sha256
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/it-messages/

  vulnerability-scan:
    name: Vulnerability scan
    needs: build
    # Scans pom.xml (with transitive dependencies) and the built provider jar, including the
    # libraries bundled in it. --no-ignore: *.jar is in .gitignore.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      download-artifact: provider-jar
      scan-args: |-
        --x-plugins=lockfile,sbom,directory,java/archive
        --no-ignore
        --recursive
        ./
      # Pull requests from forks cannot write to code scanning.
      upload-sarif: ${{ github.event_name != 'pull_request' }}
      fail-on-vuln: true
    permissions:
      actions: read
      contents: read
      security-events: write
