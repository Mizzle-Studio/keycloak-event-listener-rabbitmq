name: CI

on:
  push:
  pull_request:
  schedule:
    # weekly, to pick up advisories published after the last change
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Keycloak ${{ matrix.keycloak }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Keycloak version in pom.xml: the jar is compiled against it, and this leg's jar is the one
          # that is scanned and released.
          - keycloak: target
            image: ""
            primary: true
          # Oldest supported Keycloak line, latest patch release: the jar compiled against the target
          # version must still run there.
          - keycloak: "26.0"
            image: quay.io/keycloak/keycloak:26.0
            primary: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit tests, then integration tests against Keycloak and RabbitMQ containers.
      - name: Build
        env:
          KEYCLOAK_IMAGE: ${{ matrix.image }}
        run: >-
          ./mvnw --batch-mode --no-transfer-progress --errors --show-version clean verify
          ${KEYCLOAK_IMAGE:+"-Dit.keycloak.image=${KEYCLOAK_IMAGE}"}

      - name: Checksum
        if: matrix.primary
        run: |
          cd target
          sha256sum keycloak-to-rabbit-*.jar | tee keycloak-to-rabbit.sha256

      - name: Upload provider jar
        if: matrix.primary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-jar
          path: |
            target/keycloak-to-rabbit-*.jar
            target/keycloak-to-rabbit.sha256
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-keycloak-${{ matrix.keycloak }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/it-messages/

  vulnerability-scan:
    name: Vulnerability scan
    needs: build
    # Scans pom.xml (with transitive dependencies) and the built provider jar, including the
    # libraries bundled in it. --no-ignore: *.jar is in .gitignore.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      download-artifact: provider-jar
      scan-args: |-
        --x-plugins=lockfile,sbom,directory,java/archive
        --no-ignore
        --recursive
        ./
      # Pull requests from forks cannot write to code scanning.
      upload-sarif: ${{ github.event_name != 'pull_request' }}
      fail-on-vuln: true
    permissions:
      actions: read
      contents: read
      security-events: write

  release:
    name: Release
    # A pushed tag v<version> publishes the jar built and scanned above as a GitHub release.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, vulnerability-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download provider jar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provider-jar
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          jar="keycloak-to-rabbit-${version}.jar"
          # The tag must match the version in pom.xml, and the checksum must match the jar.
          test -f "dist/${jar}" || { echo "dist/${jar} not found: tag ${TAG} does not match the pom.xml version" >&2; exit 1; }
          (cd dist && sha256sum --check keycloak-to-rabbit.sha256)
          # Release notes: the section of CHANGELOG.md for this version.
          awk -v heading="## ${version} " 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found' \
            CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for ${version}" >&2; exit 1; }
          gh release create "${TAG}" --verify-tag --title "keycloak-to-rabbit ${version}" \
            --notes-file release-notes.md "dist/${jar}" dist/keycloak-to-rabbit.sha256
