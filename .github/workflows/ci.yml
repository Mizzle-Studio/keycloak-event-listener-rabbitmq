name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  schedule:
    # weekly, to pick up advisories published after the last change and new patch releases of the tested
    # Keycloak lines
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.versions.outputs.version }}
      keycloak: ${{ steps.versions.outputs.keycloak }}
      rabbitmq-image: ${{ steps.versions.outputs.rabbitmq-image }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit tests (including the message contract tests), then the provider jar and its SBOM. The integration
      # test runs in the next job, against this jar.
      - name: Build
        run: ./mvnw --batch-mode --no-transfer-progress --errors --show-version clean verify -DskipITs

      - name: Versions
        id: versions
        run: |
          set -- target/keycloak-to-rabbit-*.jar
          test "$#" -eq 1 || { echo "expected one provider jar, found: $*" >&2; exit 1; }
          version=$(basename "$1" .jar)
          version=${version#keycloak-to-rabbit-}
          # The property definitions in pom.xml (literal values, not ${...} references)
          keycloak=$(sed -n 's:.*<keycloak.version>\([^$<]*\)</keycloak.version>.*:\1:p' pom.xml | head -n 1)
          rabbitmq_image=$(sed -n 's:.*<it.rabbitmq.image>\([^$<]*\)</it.rabbitmq.image>.*:\1:p' pom.xml | head -n 1)
          test -n "${keycloak}" && test -n "${rabbitmq_image}"
          {
            echo "version=${version}"
            echo "keycloak=${keycloak}"
            echo "rabbitmq-image=${rabbitmq_image}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checksum
        working-directory: target
        env:
          VERSION: ${{ steps.versions.outputs.version }}
        run: sha256sum "keycloak-to-rabbit-${VERSION}.jar" | tee keycloak-to-rabbit.sha256

      - name: Upload provider jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-jar
          path: |
            target/keycloak-to-rabbit-*.jar
            target/keycloak-to-rabbit-*.cdx.json
            target/keycloak-to-rabbit.sha256
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-unit
          path: target/surefire-reports/

  integration-test:
    name: >-
      Integration test (Keycloak ${{ matrix.keycloak == 'pom' && needs.build.outputs.keycloak || matrix.keycloak
      }}${{ matrix.rabbitmq && format(', RabbitMQ {0}', matrix.rabbitmq) || '' }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERSION: ${{ needs.build.outputs.version }}
      KEYCLOAK_IMAGE: >-
        quay.io/keycloak/keycloak:${{ matrix.keycloak == 'pom' && needs.build.outputs.keycloak || matrix.keycloak }}
      RABBITMQ_IMAGE: >-
        ${{ matrix.rabbitmq && format('rabbitmq:{0}-alpine', matrix.rabbitmq) || needs.build.outputs.rabbitmq-image }}
      # The Keycloak end-to-end test on every leg; integration tests that do not involve Keycloak run only on the
      # leg with the versions in pom.xml.
      IT_TEST: ${{ (matrix.keycloak != 'pom' || matrix.rabbitmq) && 'KeycloakToRabbitMqIT' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every Keycloak 26 line at its latest patch release, then the version in pom.xml, which the jar is
          # compiled against. When pom.xml moves to a new minor line, add the previous line here.
          - keycloak: "26.0"
          - keycloak: "26.1"
          - keycloak: "26.2"
          - keycloak: "26.3"
          - keycloak: "26.4"
          - keycloak: "26.5"
          - keycloak: "26.6"
          - keycloak: "26.7"
          - keycloak: pom
          # The other legs use the RabbitMQ image in pom.xml.
          - keycloak: pom
            rabbitmq: "3.13"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Download provider jar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provider-jar
          path: dist

      # The jar from the build job, not one built here: compile the tests, then run only the integration test.
      - name: Integration test
        run: |
          (cd dist && sha256sum --check keycloak-to-rabbit.sha256)
          ./mvnw --batch-mode --no-transfer-progress --errors test-compile failsafe:integration-test failsafe:verify \
            "-Dit.provider.jar=${GITHUB_WORKSPACE}/dist/keycloak-to-rabbit-${VERSION}.jar" \
            "-Dit.keycloak.image=${KEYCLOAK_IMAGE}" "-Dit.rabbitmq.image=${RABBITMQ_IMAGE}" \
            ${IT_TEST:+"-Dit.test=${IT_TEST}"}
          # Without Docker the test is skipped, not failed.
          summary=target/failsafe-reports/failsafe-summary.xml
          if ! { grep -q '<completed>[1-9]' "${summary}" && grep -q '<skipped>0</skipped>' "${summary}"; }; then
            echo "The integration test did not run:" >&2
            cat "${summary}" >&2
            exit 1
          fi

      - name: Record the tested versions
        env:
          LEG: ${{ strategy.job-index }}
        run: |
          keycloak=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
            "${KEYCLOAK_IMAGE}")
          case "${keycloak}" in ''|'<no value>') keycloak="(${KEYCLOAK_IMAGE})" ;; esac
          rabbitmq=$(docker image inspect --format '{{ range .Config.Env }}{{ println . }}{{ end }}' "${RABBITMQ_IMAGE}" \
            | sed -n 's/^RABBITMQ_VERSION=//p')
          mkdir -p tested
          echo "Keycloak ${keycloak}, RabbitMQ ${rabbitmq}" | tee "tested/${LEG}.txt" >> "${GITHUB_STEP_SUMMARY}"

      # The release notes list the versions of all legs.
      - name: Upload the tested versions
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-${{ strategy.job-index }}
          path: tested/
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-keycloak-${{ matrix.keycloak }}${{ matrix.rabbitmq && format('-rabbitmq-{0}', matrix.rabbitmq) || '' }}
          path: |
            target/failsafe-reports/
            target/it-messages/

  vulnerability-scan:
    name: Vulnerability scan
    needs: build
    # Scans pom.xml (with transitive dependencies), the built provider jar, including the libraries bundled in
    # it, and its SBOM. --no-ignore: *.jar is in .gitignore.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      download-artifact: provider-jar
      scan-args: |-
        --x-plugins=lockfile,sbom,directory,java/archive
        --no-ignore
        --recursive
        ./
      # Pull requests from forks cannot write to code scanning.
      upload-sarif: ${{ github.event_name != 'pull_request' }}
      fail-on-vuln: true
    permissions:
      actions: read
      contents: read
      security-events: write

  # Builds the provider image (Dockerfile) without pushing it, so that a broken Dockerfile or base image shows up
  # before a release.
  provider-image:
    name: Provider image build
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download provider jar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provider-jar
          path: target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for linux/amd64 and linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          build-args: VERSION=${{ env.VERSION }}

      - name: Build for this runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          provenance: false
          build-args: VERSION=${{ env.VERSION }}
          tags: keycloak-to-rabbit:ci

      - name: Check the jar in the image
        run: |
          expected=$(cut -d ' ' -f 1 target/keycloak-to-rabbit.sha256)
          actual=$(docker run --rm keycloak-to-rabbit:ci sha256sum /opt/keycloak/providers/keycloak-to-rabbit.jar \
            | cut -d ' ' -f 1)
          test "${actual}" = "${expected}" || { echo "image jar ${actual} differs from build jar ${expected}" >&2; exit 1; }

  # One status for branch protection, whatever the matrix contains.
  result:
    name: CI result
    if: always()
    needs: [build, integration-test, vulnerability-scan, provider-image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that all jobs passed
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "${NEEDS}"
          exit 1

  release:
    name: Release
    # A pushed tag v<version> publishes the jar built, tested and scanned above as a GitHub release.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, integration-test, vulnerability-scan, provider-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # sign the attestations
      attestations: write # store the attestations
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download provider jar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provider-jar
          path: dist

      - name: Download the tested versions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tested-*
          path: tested
          merge-multiple: true

      - name: Check the release files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The tag must match the version in pom.xml, and the checksum must match the jar.
          test "${TAG}" = "v${VERSION}" || { echo "tag ${TAG} does not match the pom.xml version ${VERSION}" >&2; exit 1; }
          (cd dist && sha256sum --check keycloak-to-rabbit.sha256)
          test -s "dist/keycloak-to-rabbit-${VERSION}.cdx.json"

      # Verify with: gh attestation verify keycloak-to-rabbit-<version>.jar --repo <owner>/<repository>
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/keycloak-to-rabbit-${{ env.VERSION }}.jar
            dist/keycloak-to-rabbit-${{ env.VERSION }}.cdx.json

      # Verify with: gh attestation verify ... --predicate-type https://cyclonedx.org/bom
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/keycloak-to-rabbit-${{ env.VERSION }}.jar
          sbom-path: dist/keycloak-to-rabbit-${{ env.VERSION }}.cdx.json

      - name: Release notes
        run: |
          # The section of CHANGELOG.md for this version, the tested versions and how to verify the download.
          # GitHub appends the list of merged pull requests (categories in .github/release.yml).
          awk -v heading="## ${VERSION} " 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found' \
            CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for ${VERSION}" >&2; exit 1; }
          {
            echo
            echo "### Tested with"
            echo
            echo "CI ran the integration test with this jar on:"
            echo
            sort -V tested/*.txt | sed 's/^/* /'
            echo
            echo "### Verifying the download"
            echo
            echo '```sh'
            echo 'sha256sum --check keycloak-to-rabbit.sha256'
            echo "gh attestation verify keycloak-to-rabbit-${VERSION}.jar --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >> release-notes.md
          cat release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -- --verify-tag --title "keycloak-to-rabbit ${VERSION}" --notes-file release-notes.md --generate-notes
          case "${VERSION}" in *-alpha*|*-beta*|*-rc*) set -- "$@" --prerelease ;; esac
          gh release create "${TAG}" "$@" "dist/keycloak-to-rabbit-${VERSION}.jar" dist/keycloak-to-rabbit.sha256 \
            "dist/keycloak-to-rabbit-${VERSION}.cdx.json"

  image:
    name: Provider image
    # The released jar as ghcr.io/<owner>/keycloak-to-rabbit:<version>, at
    # /opt/keycloak/providers/keycloak-to-rabbit.jar: for COPY --from in Keycloak image builds and for init
    # containers (the busybox base provides cp).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push the image
      id-token: write # sign the attestation
      attestations: write # store the attestation
    env:
      VERSION: ${{ needs.build.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/keycloak-to-rabbit
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download provider jar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provider-jar
          path: target

      - name: Check the jar
        working-directory: target
        run: sha256sum --check keycloak-to-rabbit.sha256

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Only COPY instructions: both platforms build natively, without emulation.
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.description=keycloak-to-rabbit ${{ env.VERSION }}: Keycloak event listener that publishes events to RabbitMQ. The jar is at /opt/keycloak/providers/keycloak-to-rabbit.jar.
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.licenses=Apache-2.0
            index:org.opencontainers.image.version=${{ env.VERSION }}

      - name: Check the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # The jar in the pushed image must be the released one.
          expected=$(cut -d ' ' -f 1 target/keycloak-to-rabbit.sha256)
          actual=$(docker run --rm --platform linux/amd64 "${IMAGE}@${DIGEST}" \
            sha256sum /opt/keycloak/providers/keycloak-to-rabbit.jar | cut -d ' ' -f 1)
          test "${actual}" = "${expected}" || { echo "image jar ${actual} differs from release jar ${expected}" >&2; exit 1; }
          echo "${IMAGE}:${VERSION} (${DIGEST}) contains the release jar ${expected}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for repositories of organizations.
          create-storage-record: false
