# Categories for the list of merged pull requests that GitHub adds to release notes. The release job in
# .github/workflows/ci.yml puts the list after the CHANGELOG.md section of the release.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: Fixes
      labels:
        - bug
    - title: Features
      labels:
        - enhancement
    - title: Dependencies
      labels:
        - dependencies
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
